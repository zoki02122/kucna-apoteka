  :root{
    --bg:#EAE1C7; --bg-card:#FFFFFE; --bg-elevated:#E1D5B4;
    --green:#3F6650; --green-deep:#28402F; --green-pale:#E3E9E0;
    --amber:#A9763F; --amber-pale:#EFE6D5;
    --coral:#9C5240; --coral-pale:#EEE0DA;
    --text:#2B2B24; --text-dim:#7A7458; --line:#D6C79E;
    --surface:#fff; --on-accent:#fff; --on-danger:#fff; --on-warn:#fff; --on-text:#fff;
    --amber-line:#E3CFAE; --chip-line:#EBD2B8; --coral-line:#E8C4B9; --action-line:#E0C9A8;
    --group-bg:#D9C99A; --group-text:#5A4A26; --hero-end:#EFF4EC;
    --shadow-card:0 2px 4px rgba(43,43,36,0.07), 0 4px 12px rgba(43,43,36,0.08);
    --font-ui:-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-title:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button, .med-card, .grid-card, .expiry-chip{ transition:transform 0.1s ease, opacity 0.1s ease; }
  button:active, .med-card:active, .grid-card:active, .expiry-chip:active{ transform:scale(0.96); opacity:0.85; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font-ui); overscroll-behavior:none; }
  .serif{ font-family:var(--font-title); font-optical-sizing:auto; }
  #app{ max-width:520px; margin:0 auto; padding:0 0 110px; min-height:100vh; position:relative; }

  /* ---- Podešavanja: ceo ekran sa pločicama ---- */
  .settings-screen{ position:fixed; inset:0; z-index:46; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .set-header{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px; background:var(--bg); border-bottom:1px solid var(--line); }
  .set-back{ width:44px; height:44px; border:none; background:none; color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex:none; border-radius:12px; }
  .set-back:active{ background:var(--bg-card); }
  .set-title{ margin:0; padding:0; flex:1; min-width:0; font-size:20px; font-weight:600; color:var(--green-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .set-body{ padding:16px 14px; max-width:560px; margin:0 auto; box-sizing:border-box; }
  .set-tile{ display:flex; align-items:center; gap:14px; width:100%; padding:18px 16px; margin:0 0 12px; background:var(--bg-card); border:1px solid var(--line); border-radius:16px; cursor:pointer; text-align:left; font-family:inherit; color:var(--text); box-sizing:border-box; }
  .set-tile:active{ background:var(--bg-elevated); }
  .set-tile .tile-icon{ font-size:26px; flex:none; width:36px; text-align:center; line-height:1; }
  .set-tile .tile-text{ flex:1; min-width:0; }
  .set-tile .tile-title{ display:block; font-size:16px; font-weight:700; color:var(--text); }
  .set-tile .tile-sub{ display:block; font-size:12px; color:var(--text-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .set-tile .tile-chev{ color:var(--text-dim); font-size:22px; flex:none; line-height:1; }

  /* ---- Lista tema ---- */
  .theme-opt{ display:flex; align-items:center; gap:14px; width:100%; padding:12px; margin:0 0 10px; background:var(--bg-card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; text-align:left; font-family:inherit; color:var(--text); box-sizing:border-box; }
  .theme-opt.on{ border-color:var(--green); box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
  .theme-opt .sw{ width:74px; height:48px; border-radius:10px; flex:none; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .theme-opt .sw i{ position:absolute; left:7px; right:7px; bottom:7px; height:15px; border-radius:5px; }
  .theme-opt .sw b{ position:absolute; right:10px; top:8px; font:700 11px Georgia,serif; }
  .theme-opt .t-name{ flex:1; font-size:15.5px; font-weight:700; }
  .theme-opt .t-check{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--on-accent); }
  .theme-opt.on .t-check{ background:var(--green); border-color:var(--green); }
  /* linijske ikonice: vide se samo u novim temama; Klasična prikazuje emoji */
  .icon-btn svg, .plus-btn svg, .send-btn svg, .sicon svg{ display:none; }

  /* ---- Topbar ---- */
  .topbar{ position:sticky; top:0; z-index:10; background:var(--bg); padding:16px 16px 8px; }
  .topbar-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .app-title{ flex:1; font-size:21px; font-weight:600; color:var(--green-deep); letter-spacing:0.2px; }
  .icon-btn{ width:38px; height:38px; border-radius:11px; background:var(--bg-card); border:1px solid var(--line); color:var(--green-deep); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; box-shadow:0 1px 2px rgba(43,43,36,0.05); }
  .cart-dot{ position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%; background:var(--coral); border:2px solid var(--bg-card); }
  .search-wrap{ display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:0 4px 0 13px; box-shadow:0 1px 2px rgba(43,43,36,0.05); }
  .search-wrap input{ flex:1; border:none; background:transparent; padding:10px 8px; font-size:14px; color:var(--text); font-family:inherit; }
  .search-wrap input::placeholder{ color:var(--text-dim); }
  .search-wrap .sicon{ color:var(--text-dim); font-size:13px; }

  /* ---- Expiry banner ---- */
  .expiry-strip{ margin:0 0 0; background:var(--amber-pale); border:1px solid var(--amber-line); border-radius:14px; padding:10px 12px 9px; }
  .expiry-strip-title{ font-size:11px; font-weight:700; color:var(--amber); text-transform:none; letter-spacing:0.2px; margin-bottom:7px; padding-left:2px; }
  .expiry-chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .expiry-chip{ flex:none; background:var(--bg-card); border:1px solid var(--chip-line); border-radius:10px; padding:6px 10px; display:flex; flex-direction:column; gap:1px; min-width:84px; max-width:110px; cursor:pointer; }
  .expiry-chip.expired{ background:var(--coral-pale); border-color:var(--coral-line); }
  .expiry-chip .en{ font-size:11.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:94px; }
  .expiry-chip .ed{ font-size:9.5px; color:var(--amber); font-weight:600; }
  .expiry-chip.expired .ed{ color:var(--coral); }

  /* ---- List ---- */
  .list-area{ padding:0 16px; }
  .section-label{ font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:0.2px; padding:4px 2px 6px; }
  .group-header{ background:var(--group-bg); color:var(--group-text); font-size:10.5px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; padding:6px 11px; border-radius:8px; margin:8px 0 7px; }
  .med-card{ display:flex; align-items:center; gap:12px; background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:11px 13px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow-card); }
  .card-added{ animation:cardFlash 1.8s ease; }
  @keyframes cardFlash{ 0%{ background:var(--amber-pale); } 100%{ background:var(--bg-card); } }
  .med-thumb{ width:52px; height:52px; border-radius:12px; background:var(--green-pale); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; overflow:hidden; }
  .med-thumb img{ width:100%; height:100%; object-fit:cover; }
  .med-info{ flex:1; min-width:0; }
  .med-name{ font-size:15.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .med-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .med-badge{ flex:none; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; min-width:74px; text-align:center; background:var(--bg-elevated); color:var(--text-dim); }
  .badge-ok{ background:var(--bg-elevated); color:var(--text-dim); }
  .badge-soon{ background:var(--bg-elevated); color:var(--text-dim); }
  .badge-expired{ background:var(--bg-elevated); color:var(--text-dim); }
  .badge-missing{ background:var(--bg-elevated); color:var(--text-dim); }

  .empty{ text-align:center; color:var(--text-dim); padding:60px 24px; font-size:14.5px; line-height:1.7; }

  /* ---- Bottom bar ---- */
  .bottom-bar{ position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(43,43,36,0.06); }
  .entry-row{ display:flex; gap:8px; align-items:center; }
  .plus-btn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--bg-card); color:var(--green-deep); font-size:22px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; line-height:1; box-shadow:0 1px 3px rgba(43,43,36,0.08); }
  .chat-btn{ font-size:18px; }
  .entry-input-wrap{ flex:1; min-width:0; position:relative; display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--line); border-radius:24px; padding:4px 4px 4px 15px; }
  .entry-input-wrap input{ flex:1; min-width:0; border:none; background:transparent; padding:9px 6px; font-size:14.5px; color:var(--text); font-family:inherit; }
  .entry-input-wrap input::placeholder{ color:var(--text-dim); }
  .send-btn{ width:50px; height:50px; border-radius:50%; border:none; background:linear-gradient(150deg, var(--green), var(--green-deep)); color:var(--on-accent); font-size:19px; cursor:pointer; flex:none; box-shadow:0 3px 10px rgba(40,64,47,0.35); }

  /* ---- Modal / overlay ---- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,26,20,0.45); display:flex; align-items:center; justify-content:center; z-index:46; }
  .modal-backdrop.top{ align-items:flex-start; padding-top:0; }
  .modal{ background:var(--surface); width:calc(100% - 32px); max-width:520px; border-radius:22px; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; box-sizing:border-box; position:fixed; top:42%; left:50%; transform:translate(-50%,-50%); margin:0; box-shadow:0 14px 40px rgba(20,26,20,0.25); }
  .modal.full{ border-radius:0; max-height:100vh; height:100vh; padding-top:0; position:fixed; top:0; left:0; transform:none; width:100%; max-width:100%; }
  .modal-close-x{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; border:none; background:var(--bg-elevated); color:var(--text-dim); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5; }
  .modal h2{ margin:0 0 16px; font-size:19px; color:var(--green-deep); padding-right:34px; }

  .field{ margin-bottom:14px; }
  .field label{ font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:6px; font-weight:600; }
  .field input, .field select, .field textarea{ width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg-elevated); color:var(--text); font-size:14.5px; font-family:inherit; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-hint{ font-size:11px; color:var(--text-dim); margin-top:5px; line-height:1.4; }
  .field-warn{ font-size:11.5px; color:var(--amber); margin-top:5px; font-weight:600; }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{ flex:1; padding:13px; border-radius:13px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; }
  .cancel-btn{ background:var(--bg-elevated); color:var(--text); }
  .save-btn{ background:linear-gradient(150deg, var(--green), var(--green-deep)); color:var(--on-accent); }
  .delete-btn{ background:var(--coral); color:var(--on-danger); }

  /* ---- Detail overlay ---- */
  .detail-hero{ background:linear-gradient(155deg, var(--green-pale), var(--hero-end)); padding:20px 18px 22px; display:flex; align-items:center; gap:14px; }
  .detail-thumb{ width:64px; height:64px; border-radius:15px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:28px; flex:none; overflow:hidden; cursor:pointer; box-shadow:0 2px 8px rgba(40,64,47,0.14); }
  .detail-thumb img{ width:100%; height:100%; object-fit:cover; }
  .detail-title{ font-size:20px; font-weight:600; color:var(--green-deep); }
  .detail-type{ font-size:12px; color:var(--green); margin-top:3px; font-weight:600; }
  .detail-body{ padding:18px; }
  .detail-block{ margin-bottom:18px; }
  .detail-block-label{ font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:0.2px; margin-bottom:6px; }
  .detail-block-content{ font-size:14.5px; line-height:1.55; color:var(--text); }
  .detail-block.primary .detail-block-content{ font-size:15.5px; font-weight:500; }
  .detail-block.warn .detail-block-content{ color:var(--amber); }
  .detail-actions{ display:flex; gap:10px; padding:0 18px 18px; }
  .detail-actions button{ flex:1; padding:13px; border-radius:13px; border:none; font-weight:700; cursor:pointer; }
  .photo-full{ position:fixed; inset:0; background:#000; z-index:47; display:flex; align-items:center; justify-content:center; }
  .photo-full img{ max-width:100%; max-height:100%; }
  .photo-attach-btn{ display:flex; align-items:center; gap:10px; background:var(--bg-elevated); border:1px dashed var(--line); border-radius:13px; padding:12px; cursor:pointer; color:var(--green-deep); font-size:13.5px; font-weight:600; }
  .photo-attach-btn .pa-icon{ font-size:20px; }
  .photo-preview-box{ display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border-radius:13px; padding:10px; margin-bottom:14px; }
  .photo-preview-box img{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex:none; }
  .photo-preview-actions{ display:flex; gap:8px; flex:1; }
  .photo-preview-actions button{ flex:1; border:none; border-radius:9px; padding:8px; font-size:12px; font-weight:700; cursor:pointer; }
  .pp-change{ background:var(--green-pale); color:var(--green-deep); }
  .pp-remove{ background:var(--coral-pale); color:var(--coral); }
  .ai-analyzing{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--green-deep); font-weight:600; padding:4px 2px 14px; }
  .ai-spinner{ width:14px; height:14px; border-radius:50%; border:2px solid var(--green-pale); border-top-color:var(--green-deep); animation:spin 0.7s linear infinite; flex:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .attach-menu-options{ display:flex; gap:10px; justify-content:space-around; margin-top:6px; }
  .attach-menu-opt{ display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; flex:1; padding:10px 4px; }
  .attach-menu-opt .ao-icon{ width:54px; height:54px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .attach-menu-opt span{ font-size:12px; color:var(--text); font-weight:600; }
  #statusBanner{ position:fixed; top:0; left:0; right:0; z-index:60; max-width:520px; margin:0 auto; padding:13px 16px; font-size:13px; font-weight:600; line-height:1.45; display:none; align-items:flex-start; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.18); }
  .quick-toast{ position:fixed; top:42%; left:50%; z-index:65; background:var(--bg-card); border:1px solid var(--line); border-radius:20px; padding:24px 28px; box-shadow:0 10px 34px rgba(0,0,0,0.28); display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; max-width:250px; opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(0.88); transition:opacity 0.22s ease, transform 0.22s ease; }
  .quick-toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .quick-toast .qt-icon{ font-size:36px; line-height:1; }
  .quick-toast .qt-text{ font-size:14.5px; font-weight:700; color:var(--text); }
  #statusBanner.show{ display:flex; }
  #statusBanner.error{ background:var(--coral); color:var(--on-danger); }
  #statusBanner.info{ background:var(--green-deep); color:var(--on-accent); }
  #statusBanner .closeBtn{ margin-left:auto; flex:none; background:none; border:none; color:inherit; font-size:15px; cursor:pointer; opacity:0.85; }
  .backup-reminder-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--coral); color:var(--on-danger); font-size:12px; font-weight:600; padding:9px 11px; border-radius:11px; margin-bottom:9px; }
  .backup-reminder-row button{ flex:none; background:rgba(255,255,255,0.2); color:inherit; border:1px solid rgba(255,255,255,0.4); padding:6px 11px; border-radius:8px; font-weight:700; font-size:11.5px; font-family:inherit; cursor:pointer; }
  .photo-full-close{ position:absolute; top:18px; right:18px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:16px; cursor:pointer; }
  #undoToast{ position:fixed; left:14px; right:14px; bottom:96px; max-width:492px; margin:0 auto; z-index:55; background:var(--text); color:var(--on-text); border-radius:13px; padding:12px 14px; display:none; align-items:center; justify-content:space-between; gap:10px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.25); }
  #undoToast.show{ display:flex; }
  #undoToast button{ background:var(--amber); color:var(--on-warn); border:none; border-radius:9px; padding:8px 14px; font-weight:700; font-size:12.5px; cursor:pointer; flex:none; }

  /* ---- AI Chat ---- */
  .chat-overlay{ position:fixed; inset:0; background:var(--surface); z-index:45; display:flex; flex-direction:column; }
  .chat-header{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); flex:none; }
  .chat-header h2{ font-size:16px; font-weight:700; color:var(--green-deep); flex:1; margin:0; }
  .chat-close-btn{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--bg-elevated); color:var(--green-deep); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
  .chat-messages{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .chat-empty{ color:var(--text-dim); font-size:13px; text-align:center; margin-top:40px; padding:0 20px; line-height:1.6; }
  .chat-bubble{ max-width:84%; padding:10px 13px; border-radius:15px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .chat-bubble.user{ align-self:flex-end; background:var(--green-deep); color:var(--on-accent); border-bottom-right-radius:4px; }
  .chat-bubble.ai{ align-self:flex-start; background:var(--bg-elevated); border:1px solid var(--line); color:var(--text); border-bottom-left-radius:4px; }
  .chat-bubble.thinking{ color:var(--text-dim); font-style:italic; }
  .chat-bubble strong{ color:var(--amber); }
  .chat-item-refs{ display:flex; flex-direction:column; gap:7px; margin-top:6px; max-width:88%; }
  .chat-item-chip{ display:flex; align-items:center; gap:10px; background:var(--bg-card); border:1px solid var(--line); border-radius:13px; padding:10px 12px; cursor:pointer; box-shadow:0 1px 3px rgba(43,43,36,0.07); }
  .chat-item-chip .cic-icon{ font-size:19px; width:30px; height:30px; border-radius:8px; background:var(--green-pale); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .shop-thumb{ width:34px; height:34px; border-radius:9px; overflow:hidden; flex:none; cursor:pointer; border:1px solid var(--line); }
  .shop-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .chat-item-chip .cic-icon img{ width:100%; height:100%; object-fit:cover; }
  .chat-item-chip .cic-name{ font-size:13.5px; font-weight:600; color:var(--text); flex:1; }
  .chat-item-chip .cic-arrow{ color:var(--green-deep); font-size:15px; flex:none; }
  .chat-action-card{ align-self:flex-start; max-width:90%; background:var(--amber-pale); border:1px solid var(--action-line); border-radius:14px; padding:11px 13px; margin-top:-2px; }
  .chat-action-title{ font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:5px; }
  .chat-action-card ul{ margin:0; padding-left:18px; font-size:12.5px; }
  .chat-action-card li{ margin-bottom:3px; }
  .chat-action-buttons{ display:flex; gap:8px; margin-top:9px; }
  .chat-action-buttons button{ flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; border:none; }
  .chat-action-confirm{ background:var(--green-deep); color:var(--on-accent); }
  .chat-action-cancel{ background:var(--surface); border:1px solid var(--line); color:var(--text); }
  .chat-input-row{ display:flex; gap:8px; align-items:center; padding:11px 14px; border-top:1px solid var(--line); flex:none; }
  .grid-list{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .grid-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:13px 10px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; cursor:pointer; position:relative; min-width:0; box-shadow:var(--shadow-card); }
  .grid-card .med-thumb{ width:60px; height:60px; font-size:26px; }
  .gc-name{ font-size:13px; font-weight:600; color:var(--text); line-height:1.3; }
  .gc-sub{ font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gc-badge{ position:absolute; top:8px; right:8px; font-size:9px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .sort-toggle{ display:flex; gap:3px; background:var(--bg-elevated); border-radius:11px; padding:3px; margin:2px 0 8px; }
  .sort-toggle button{ flex:1; border:none; background:transparent; padding:9px 2px; font-size:10px; font-weight:700; color:var(--text-dim); border-radius:9px; cursor:pointer; white-space:nowrap; }
  .sort-toggle button.active{ background:var(--green-deep); color:var(--on-accent); }
  .detail-field{ margin-bottom:16px; }
  .detail-action-btn{ display:block; width:100%; padding:12px; border-radius:12px; font-weight:700; font-size:13.5px; cursor:pointer; margin-bottom:16px; }
  .detail-field-label{ font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:7px; }
  .detail-field-value{ background:var(--bg-elevated); border-radius:12px; padding:13px 14px; font-size:14.5px; color:var(--text); line-height:1.5; }
  .detail-field-value.warn{ color:var(--amber); font-weight:600; }
  .detail-field-value.muted{ color:var(--text-dim); }

  /* ---- Photo crop ---- */
  .crop-overlay{ position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column; }
  .crop-header{ padding:16px; color:#fff; font-size:13.5px; font-weight:600; text-align:center; }
  .crop-stage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; touch-action:none; }
  .crop-img-wrap{ position:relative; }
  .crop-box{ position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,0.6); touch-action:none; cursor:move; }
  .crop-handle{ position:absolute; right:-12px; bottom:-12px; width:28px; height:28px; background:#fff; border-radius:50%; border:3px solid var(--green-deep); touch-action:none; }
  .crop-actions{ display:flex; gap:10px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .crop-actions button{ flex:1; padding:13px; border-radius:13px; border:none; font-weight:700; font-size:13.5px; cursor:pointer; }
  .crop-skip{ background:rgba(255,255,255,0.16); color:#fff; }
  .crop-confirm{ background:var(--green-deep); color:var(--on-accent); }

[data-theme="ponoc"] .detail-hero{ background:#000; border-bottom:1px solid var(--line); }

[data-theme="ponoc"] .chat-overlay{ background:#000; }

[data-theme="ponoc"] .chat-action-title{ font-family:var(--font-title); font-size:14px; font-weight:600; color:var(--accent); }

[data-theme="ponoc"] .backup-reminder-row{ background:var(--card-shine), var(--bg-card); border:1px solid var(--coral); color:var(--text); }
[data-theme="ponoc"] .backup-reminder-row button{ background:#000; border:1px solid var(--coral); color:var(--coral); }

<body>
<div id="statusBanner"></div>
<div id="undoToast"></div>
<div id="app"></div>

<script>
/* ---------- MOCK STATE (test podaci - biće zamenjeni pravim unosom) ---------- */
let items = [];
let settings = { expiryThresholdDays: 60, viewMode: 'lista', sortMode: 'naziv', theme: 'klasicna' };
let searchOpen = false;
let searchQuery = '';
let openDetailId = null;

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(todayISO());
  let target;
  if(iso.length===7){ const [y,m] = iso.split('-').map(Number); target = new Date(y, m, 0); } // poslednji dan tog meseca
  else { target = new Date(iso); }
  return Math.round((target - today) / 86400000);
}
function dmyFromISO(iso){
  if(!iso) return null;
  if(iso.length===7){ const [y,m]=iso.split('-'); return m+'.'+y+'.'; }
  const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y+'.';
}
function foldDiacritics(s){
  if(!s) return '';
  return s.toLowerCase().replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'dj');
}
function stemWord(w){
  return (w.length>3 && /[aeiou]$/.test(w)) ? w.slice(0,-1) : w;
}
function normalizeSearchWord(w){ return stemWord(foldDiacritics(w)); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function displayNaziv(naziv){
  if(!naziv) return '';
  return naziv.split(' ').map(word=>{
    if(word.length>1 && /[A-ZČĆŽŠĐ]/.test(word) && word===word.toUpperCase() && word!==word.toLowerCase()){
      return word.charAt(0)+word.slice(1).toLowerCase();
    }
    return word;
  }).join(' ');
}
function uid(p){ return p+Date.now()+Math.random().toString(36).slice(2,6); }

/* ---------- PERSISTENCE (localStorage) ---------- */
function lsGet(key){ try{ const v=localStorage.getItem(key); return v===null?null:{value:v}; }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

/* ---------- BACKUP: export / import / reminder ---------- */
function exportBackup(){
  const backup = { version:1, exportedAt: new Date().toISOString(), items: items, settings: settings, shopping: shoppingList, backupIntervalDays: getBackupIntervalDays() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'apoteka-bekap-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  markBackupDone();
  render();
  const hintEl = document.getElementById('lastBackupHint');
  if(hintEl) hintEl.textContent = 'Poslednji bekap: '+lastBackupDisplay();
  showBanner('Bekap preuzet — sačuvaj ga na sigurno mesto (npr. Google Drive).', 'info');
}
function triggerImportBackup(){
  const inp = document.getElementById('backupFileInput');
  if(inp) inp.click();
}
function handleImportFile(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let backup;
    try{ backup = JSON.parse(e.target.result); }
    catch(err){ showBanner('Fajl nije validan (nije ispravan JSON).'); return; }
    if(!backup || !Array.isArray(backup.items)){ showBanner('Ovaj fajl ne izgleda kao ispravan bekap.'); return; }
    const count = backup.items.length;
    const when = backup.exportedAt ? backup.exportedAt.slice(0,10) : 'nepoznatog datuma';
    showConfirm('Ovo će zameniti trenutne podatke sa '+count+' stavki iz bekapa od '+when+'. Trenutni podaci će biti izgubljeni. Nastaviti?', ()=>{
      applyBackup(backup);
    }, 'Da, uvezi');
  };
  reader.readAsText(file);
  fileInput.value = '';
}
function applyBackup(backup){
  items = backup.items || [];
  persistItems();
  if(backup.settings){
    const prevTheme = getTheme();
    settings = Object.assign(settings, backup.settings);
    if(!validTheme(settings.theme)) settings.theme = prevTheme;
    persistSettings();
    applyTheme(getTheme());
  }
  // spisak za kupovinu i interval podsetnika: samo ako ih bekap sadrži (stari bekapi ih nemaju, pa se postojeće ne dira)
  if(Array.isArray(backup.shopping)){ shoppingList = backup.shopping; persistShoppingList(); }
  const bi = parseInt(backup.backupIntervalDays);
  if(bi > 0) setBackupIntervalDays(bi);
  closeSettings();
  render();
  showBanner('Bekap uspešno uvezen.', 'info');
}
function getBackupIntervalDays(){
  const v = lsGet('apoteka:backupIntervalDays');
  const n = v ? parseInt(v.value) : NaN;
  return (n && n > 0) ? n : 7;
}
function setBackupIntervalDays(days){ lsSet('apoteka:backupIntervalDays', String(days)); }
function getLastBackupDate(){
  const v = lsGet('apoteka:lastBackup');
  return v ? new Date(v.value) : null;
}
function markBackupDone(){ lsSet('apoteka:lastBackup', new Date().toISOString()); }
function daysSinceBackup(date){ return Math.floor((Date.now() - date.getTime()) / 86400000); }
function lastBackupDisplay(){
  const last = getLastBackupDate();
  if(!last) return 'nikad';
  return String(last.getDate()).padStart(2,'0')+'.'+String(last.getMonth()+1).padStart(2,'0')+'.'+last.getFullYear()+'.';
}
function backupReminderHtml(){
  const last = getLastBackupDate();
  const interval = getBackupIntervalDays();
  let msg = null;
  if(!last){
    msg = 'Nikad nisi napravio bekap podataka.';
  } else {
    const d = daysSinceBackup(last);
    if(d >= interval) msg = 'Prošlo je '+d+' dana od poslednjeg bekapa.';
  }
  if(!msg) return '';
  return '<div class="backup-reminder-row">'+
    '<span>'+escapeHtml(msg)+'</span>'+
    '<button onclick="exportBackup()">izvezi bekap</button>'+
    '</div>';
}
function saveBackupInterval(val){
  const n = parseInt(val) || 7;
  setBackupIntervalDays(n);
  render();
}
function persistItems(){ lsSet('apoteka:items', JSON.stringify(items)); }
function loadItems(){
  const saved = lsGet('apoteka:items');
  if(saved && saved.value){ try{ items = JSON.parse(saved.value); }catch(e){} }
  else { persistItems(); }
}
function persistSettings(){ lsSet('apoteka:settings', JSON.stringify(settings)); }
function loadSettings(){
  const saved = lsGet('apoteka:settings');
  if(saved && saved.value){ try{ settings = Object.assign(settings, JSON.parse(saved.value)); }catch(e){} }
  if(!validTheme(settings.theme)) settings.theme = 'klasicna';
}
function getApiKey(){ const k=lsGet('apoteka:apiKey'); return (k && k.value) ? k.value : ''; }
function setApiKey(v){ lsSet('apoteka:apiKey', v); }

/* ---------- STATUS BANNER ---------- */
let bannerTimeout=null;
let quickToastTimeout = null;
function showQuickToast(msg, icon){
  let el = document.getElementById('quickToast');
  if(!el){ el = document.createElement('div'); el.id='quickToast'; el.className='quick-toast'; document.body.appendChild(el); }
  el.innerHTML = '<div class="qt-icon">'+(icon||'🛒')+'</div><div class="qt-text">'+escapeHtml(msg)+'</div>';
  el.classList.add('show');
  clearTimeout(quickToastTimeout);
  quickToastTimeout = setTimeout(()=>{ el.classList.remove('show'); }, 1700);
}
function showBanner(msg, type){
  type = type||'error';
  const b = document.getElementById('statusBanner');
  b.className = 'show '+type;
  b.innerHTML = '<span>'+escapeHtml(msg)+'</span><button class="closeBtn" onclick="hideBanner()">✕</button>';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(hideBanner, 9000);
}
function hideBanner(){
  const b = document.getElementById('statusBanner');
  if(b) b.className='';
  clearTimeout(bannerTimeout);
}

/* ---------- UNDO (poništi brisanje) ---------- */
let lastDeletedItem = null;
let undoTimeout = null;
function showUndoToast(message){
  const t = document.getElementById('undoToast');
  if(!t) return;
  t.className = 'show';
  t.innerHTML = '<span>'+escapeHtml(message)+'</span><button onclick="performUndo()">Poništi</button>';
  clearTimeout(undoTimeout);
  undoTimeout = setTimeout(hideUndoToast, 6000);
}
function hideUndoToast(){
  const t = document.getElementById('undoToast');
  if(t) t.className = '';
  clearTimeout(undoTimeout);
  lastDeletedItem = null;
}
function performUndo(){
  if(!lastDeletedItem) return;
  items.push(lastDeletedItem);
  persistItems();
  lastDeletedItem = null;
  const t = document.getElementById('undoToast');
  if(t) t.className = '';
  clearTimeout(undoTimeout);
  render();
}

/* ---------- OVERLAY STACK (da dugme/gest "nazad" zatvara prozorčić umesto da napusti stranicu) ---------- */
let overlayStack = [];
let suppressPopstateCount = 0;
function pushOverlay(removeFn){
  overlayStack.push(removeFn);
  try{ history.pushState({ovl:true}, '', location.href); }catch(e){}
}
function closeOverlay(removeFn){
  const idx = overlayStack.lastIndexOf(removeFn);
  if(idx!==-1) overlayStack.splice(idx,1);
  removeFn();
  suppressPopstateCount++;
  try{ history.back(); }catch(e){ suppressPopstateCount--; }
}
function swapOverlay(oldRemoveFn, newRemoveFn){
  // zamenjuje jedan otvoren prozorcic drugim na ISTOM nivou, bez diranja istorije uopste -
  // ponovo koristi vec postojeci korak istorije koji je otvorio prethodni prozorcic
  const idx = overlayStack.lastIndexOf(oldRemoveFn);
  if(idx!==-1) overlayStack.splice(idx,1);
  oldRemoveFn();
  overlayStack.push(newRemoveFn);
}
window.addEventListener('popstate', function(){
  if(suppressPopstateCount>0){ suppressPopstateCount--; return; }
  if(exitConfirmed){ return; }
  const fn = overlayStack.pop();
  if(fn){ fn(); return; }
  exitTrapArmed = false;
  showExitConfirm();
});

function expiryStatus(item){
  if(!item.rok) return { key:'missing', label:'' };
  const d = daysUntil(item.rok);
  if(d < 0) return { key:'expired', label:'Isteklo' };
  if(d <= settings.expiryThresholdDays) return { key:'soon', label:'Ističe za '+d+' d.' };
  return { key:'ok', label:dmyFromISO(item.rok) };
}

function getItem(id){ return items.find(i=>i.id===id); }

/* ---------- DUGI PRITISAK NA KARTICU -> BRZI MENI ---------- */
let cardLongPressTimer = null;
let cardLongPressFired = false;
function startCardLongPress(id){
  cardLongPressFired = false;
  clearTimeout(cardLongPressTimer);
  cardLongPressTimer = setTimeout(()=>{
    cardLongPressFired = true;
    if(navigator.vibrate) navigator.vibrate(30);
    openCardQuickMenu(id);
  }, 500);
}
function cancelCardLongPress(){ clearTimeout(cardLongPressTimer); }
function handleCardClick(id){
  if(cardLongPressFired){ cardLongPressFired = false; return; }
  openDetail(id);
}
let cardMenuCloseFn = null;
function openCardQuickMenu(id){
  const it = getItem(id);
  if(!it) return;
  const b = document.createElement('div'); b.className='modal-backdrop small-modal'; b.id='cardMenuBackdrop';
  b.innerHTML = '<div class="modal" style="border-radius:20px;">'+
    '<button class="modal-close-x" onclick="closeCardQuickMenu()">✕</button>'+
    '<h2 class="serif" style="font-size:16px; padding-right:30px;">'+escapeHtml(displayNaziv(it.naziv))+'</h2>'+
    '<div style="display:flex; flex-direction:column; gap:9px; margin-top:4px;">'+
    '<button class="cancel-btn" style="text-align:left; padding:13px 14px; border-radius:12px; font-weight:700; font-size:14px;" onclick="quickTogglePin(\''+it.id+'\')">'+(it.pinned ? '📌 Otkači sa vrha' : '📌 Zakači na vrh')+'</button>'+
    '<button class="cancel-btn" style="text-align:left; padding:13px 14px; border-radius:12px; font-weight:700; font-size:14px;" onclick="quickAddToShoppingList(\''+it.id+'\')">🛒 Dodaj na spisak za kupovinu</button>'+
    '<button class="delete-btn" style="text-align:left; padding:13px 14px; border-radius:12px; font-weight:700; font-size:14px;" onclick="quickDeleteFromMenu(\''+it.id+'\')">🗑 Obriši</button>'+
    '</div></div>';
  document.body.appendChild(b);
  b.addEventListener('click',(e)=>{ if(e.target===b) closeCardQuickMenu(); });
  cardMenuCloseFn = ()=>{ const bb=document.getElementById('cardMenuBackdrop'); if(bb) bb.remove(); cardMenuCloseFn=null; };
  pushOverlay(cardMenuCloseFn);
}
function quickTogglePin(id){
  const it = getItem(id);
  if(!it) return;
  it.pinned = !it.pinned;
  persistItems();
  closeCardQuickMenu();
  render();
  showBanner(it.pinned ? 'Zakačeno na vrh.' : 'Otkačeno.', 'info');
}
function closeCardQuickMenu(){
  if(cardMenuCloseFn){ closeOverlay(cardMenuCloseFn); cardMenuCloseFn = null; }
}
function quickDeleteFromMenu(id){
  const oldFn = cardMenuCloseFn;
  cardMenuCloseFn = null;
  confirmDeleteItem(id, oldFn);
}

/* ---------- SPISAK ZA KUPOVINU ---------- */
let shoppingList = [];
function persistShoppingList(){ lsSet('apoteka:shopping', JSON.stringify(shoppingList)); }
function loadShoppingList(){
  const saved = lsGet('apoteka:shopping');
  if(saved && saved.value){ try{ shoppingList = JSON.parse(saved.value); }catch(e){} }
}
function addToShoppingList(tekst, itemId){
  if(!tekst || !tekst.trim()) return false;
  const norm = foldDiacritics(tekst.trim());
  const dup = shoppingList.some(s => (itemId && s.itemId===itemId) || foldDiacritics(s.tekst)===norm);
  if(dup) return false;
  shoppingList.push({ id: uid('s'), tekst: tekst.trim(), kupljeno:false, itemId: itemId||null });
  persistShoppingList();
  return true;
}
function quickAddToShoppingList(id){
  const it = getItem(id);
  if(!it) return;
  const added = addToShoppingList(it.naziv, it.id);
  closeCardQuickMenu();
  showQuickToast(added ? 'Dodato na spisak za kupovinu.' : 'Već je na spisku za kupovinu.', added ? '🛒' : '📋');
}
let shoppingCloseFn = null;
function openShoppingList(){
  renderShoppingList();
  shoppingCloseFn = ()=>{ const el=document.getElementById('shoppingOverlayRoot'); if(el) el.remove(); shoppingCloseFn=null; };
  pushOverlay(shoppingCloseFn);
}
function closeShoppingList(){
  if(shoppingCloseFn){ closeOverlay(shoppingCloseFn); shoppingCloseFn = null; }
}
function renderShoppingList(){
  let root = document.getElementById('shoppingOverlayRoot');
  if(!root){ root = document.createElement('div'); root.id='shoppingOverlayRoot'; document.body.appendChild(root); }
  const hasChecked = shoppingList.some(s=>s.kupljeno);
  root.innerHTML = '<div class="chat-overlay">'+
    '<div class="chat-header"><h2 class="serif">Spisak za kupovinu</h2>'+
    (hasChecked ? '<button class="chat-close-btn" style="margin-right:6px;" onclick="clearBoughtItems()" title="Očisti kupljeno">🧹</button>' : '')+
    '<button class="chat-close-btn" onclick="closeShoppingList()">✕</button></div>'+
    '<div class="chat-messages" id="shoppingListEl">'+
    (shoppingList.length===0 ? '<div class="chat-empty">Spisak je prazan. Dodaj nešto ispod, ili preko dugog pritiska na karticu leka.</div>' :
      shoppingList.map(s=>{
        const linked = s.itemId ? getItem(s.itemId) : null;
        return '<div style="display:flex; align-items:center; gap:10px; background:var(--bg-card); border:1px solid var(--line); border-radius:13px; padding:11px 13px;">'+
        '<button onclick="toggleShoppingItem(\''+s.id+'\')" style="width:24px;height:24px;border-radius:7px;border:2px solid '+(s.kupljeno?'var(--green-deep)':'var(--line)')+';background:'+(s.kupljeno?'var(--green-deep)':'transparent')+';color:var(--on-accent);font-size:13px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">'+(s.kupljeno?'✓':'')+'</button>'+
        (linked && linked.slika ? '<div class="shop-thumb" onclick="openPhotoFullScreen(\''+linked.id+'\')"><img src="'+linked.slika+'"></div>' : '')+
        '<span style="flex:1; font-size:14px;'+(s.kupljeno?'text-decoration:line-through;color:var(--text-dim);':'')+'">'+escapeHtml(s.tekst)+'</span>'+
        '<button onclick="removeShoppingItem(\''+s.id+'\')" style="background:none;border:none;color:var(--coral);font-size:15px;cursor:pointer;flex:none;padding:4px;">✕</button>'+
        '</div>';
      }).join('')
    )+
    '</div>'+
    '<div class="chat-input-row">'+
    '<div class="entry-input-wrap"><input type="text" id="shoppingInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Dodaj na spisak..." onkeydown="if(event.key===\'Enter\') submitShoppingInput()"></div>'+
    '<button class="send-btn" onclick="submitShoppingInput()">'+ic('➤','send')+'</button>'+
    '</div></div>';
}

function sortItems(arr){
  const copy = arr.slice();
  if(settings.sortMode==='kategorija'){
    copy.sort((a,b)=>{
      const ka = a.kategorija||'\uffff', kb = b.kategorija||'\uffff';
      const c = ka.localeCompare(kb,'sr');
      return c!==0 ? c : a.naziv.localeCompare(b.naziv,'sr');
    });
  } else if(settings.sortMode==='tip'){
    copy.sort((a,b)=>{
      const ta = a.tip||'\uffff', tb = b.tip||'\uffff';
      const c = ta.localeCompare(tb,'sr');
      return c!==0 ? c : a.naziv.localeCompare(b.naziv,'sr');
    });
  } else if(settings.sortMode==='rok'){
    copy.sort((a,b)=>{
      const ra = a.rok || '9999-99', rb = b.rok || '9999-99';
      return ra.localeCompare(rb);
    });
  } else {
    copy.sort((a,b)=> a.naziv.localeCompare(b.naziv,'sr'));
  }
  copy.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));
  return copy;
}
function setSortMode(mode){
  settings.sortMode = mode;
  persistSettings();
  render();
}

function escapeChatText(text){
  const escaped = escapeHtml(text);
  const lines = escaped.split('\n');
  let html = ''; let inList = false;
  lines.forEach(line=>{
    const trimmed = line.trim();
    if(/^-\s+/.test(trimmed)){
      if(!inList){ html += '<ul class="chat-ul" style="margin:2px 0 8px; padding-left:18px;">'; inList = true; }
      html += '<li style="margin-bottom:3px;">'+trimmed.replace(/^-\s+/,'')+'</li>';
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      if(trimmed==='') { /* prazan red */ }
      else html += '<p style="margin:0 0 6px;">'+trimmed+'</p>';
    }
  });
  if(inList) html += '</ul>';
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\{\{([\w-]+):(.*?)\}\}/g, (m, id, naziv)=> naziv);
  return html || escaped;
}
function extractChatItemRefs(text){
  const refs = []; const seen = new Set();
  const re = /\{\{([\w-]+):(.*?)\}\}/g;
  let m;
  while((m = re.exec(text))){
    const id = m[1];
    if(seen.has(id)) continue;
    const it = getItem(id);
    if(it){ seen.add(id); refs.push(it); }
  }
  return refs;
}
function parseChatAction(raw){
  const marker = /###AKCIJA###([\s\S]*?)###KRAJ###/;
  const match = marker.exec(raw);
  if(!match) return { cleanText: raw.trim(), actions: null };
  const cleanText = raw.slice(0, match.index).trim();
  let actions = null;
  try{ actions = JSON.parse(match[1].trim()); if(!Array.isArray(actions)) actions=null; }catch(e){ actions=null; }
  return { cleanText: cleanText || raw.trim(), actions };
}
function describeChatAction(act){
  if(act.tip==='dodaj'){
    const f = act.polja||{};
    return 'Dodavanje: "'+(f.naziv||'')+'"'+(f.kategorija?(' · '+f.kategorija):'')+(f.rok?(' · rok '+dmyFromISO(f.rok)):'');
  }
  const it = getItem(act.stavka_id);
  const itemDesc = it ? it.naziv : (act.stavka_id||'?');
  if(act.tip==='obrisi') return 'Brisanje: "'+itemDesc+'"';
  if(act.tip==='izmeni'){
    const changes = Object.keys(act.polja||{}).map(k=> k+': '+act.polja[k]).join(', ');
    return 'Izmena: "'+itemDesc+'" → '+changes;
  }
  return '';
}
function applyChatActions(msgIdx){
  const msg = chatMessages[msgIdx];
  if(!msg || !msg.actions) return;
  msg.actions.forEach(act=>{
    try{
      if(act.tip==='izmeni'){
        const it = getItem(act.stavka_id);
        if(it) Object.assign(it, act.polja||{});
      } else if(act.tip==='obrisi'){
        items = items.filter(i=>i.id!==act.stavka_id);
      } else if(act.tip==='dodaj'){
        items.push(Object.assign({ id: uid('m'), tip:'', kategorija:'', doziranje:'', napomena:'', rok:'', slika:null, ikonica:'💊', prosireno:'' }, act.polja||{}));
      }
    }catch(err){}
  });
  persistItems();
  msg.actionStatus = 'applied';
  chatMessages.push({role:'ai', text:'Gotovo — izmene su sačuvane.'});
  renderChatOverlay();
  render();
}
function cancelChatActions(msgIdx){
  const msg = chatMessages[msgIdx];
  if(!msg) return;
  msg.actionStatus = 'cancelled';
  chatMessages.push({role:'ai', text:'U redu, izmene nisu primenjene.'});

async function sendChatMessage(){
  const inp = document.getElementById('chatInputField');
  const text = inp ? inp.value.trim() : '';
  if(!text) return;
  if(inp) inp.value = '';
  const historyBefore = chatMessages.slice();
  chatMessages.push({role:'user', text: text});
  chatMessages.push({role:'ai', text:'Razmišljam...', thinking:true});
  renderChatOverlay();
  let answer;
  try{
    answer = await askAIAboutMedicines(text, historyBefore);
  } catch(err){
    chatMessages.pop();
    chatMessages.push({role:'ai', text:(err && err.message) ? err.message : 'Greška pri komunikaciji sa AI servisom.'});
    renderChatOverlay();
    return;
  }
  chatMessages.pop();
  const parsed = parseChatAction(answer);
  chatMessages.push({role:'ai', text: parsed.cleanText, actions: parsed.actions, actionStatus: parsed.actions ? 'pending' : null});
  renderChatOverlay();
}
async function askAIAboutMedicines(question, history){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error('Nije unet Gemini API ključ. Idi u Podešavanja (⚙) i unesi ga.');
  const dataSummary = JSON.stringify(items.map(it=>({
    id: it.id, naziv: it.naziv, tip: it.tip, kategorija: it.kategorija,
    doziranje: it.doziranje, napomena: it.napomena, rok: it.rok, prosireno: it.prosireno
  })));
  const sys = 'Ti si pomoćnik unutar aplikacije "Kućna apoteka" (spisak lekova, suplemenata, vitamina i sličnog u domaćinstvu). '+
    'Evo svih trenutnih stavki u JSON formatu: '+dataSummary+'. '+
    'Danas je: '+todayISO()+'. '+
    'Odgovaraj na pitanja korisnika kratko i jasno na srpskom jeziku — pretraga, filtriranje po kategoriji/nazivu/roku, zbrajanje, poređenje. Polje "prosireno" (ako postoji) sadrži NAJDETALJNIJI opis svih situacija za koje se stavka koristi — OBAVEZNO ga pretraži kad tražiš da li nešto pomaže za određeno stanje/simptom, jer tamo često piše nešto što nije u kraćem polju "kategorija". Kad nabrajaš VIŠE stavki koje odgovaraju pitanju, budi kratak PO STAVCI (par reči objašnjenja, ne ceo pasus) da bi mogao da nabrojiš SVE koje odgovaraju, ne samo prvu — potpunost spiska je važnija od dužine objašnjenja svake stavke. '+
    'Ako podaci ne sadrže odgovor, iskreno reci da ne možeš da nađeš tu informaciju. NIKAD ne izmišljaj medicinske savete koji nisu u podacima — ako korisnik pita nešto medicinski osetljivo van onoga što piše u napomeni, predloži da proveri sa farmaceutom ili lekarom. '+
    'FORMATIRANJE: piši prirodnim rečenicama; za spisak stavki koristi novi red sa "- " ispred svake. Kad god pomeneš KONKRETNU stavku iz apoteke po imenu (bilo gde u odgovoru, ne samo u spisku), OBAVEZNO je napiši u formatu {{id:naziv}} — npr. {{m1758m3f2a:Pulmint fresh inhalator}} — koristeći TAČAN "id" te stavke iz podataka iznad; ne koristi zvezdice za nazive stavki, samo za ostale bitne reči/brojeve ako treba (**tako**). '+
    'IZMENE PODATAKA: možeš predložiti dodavanje/izmenu/brisanje stavke, ali NIKAD je sam ne primenjuješ — korisnik mora ručno da potvrdi. '+
    'Kad predlažeš izmenu, na SAMOM KRAJU odgovora dodaj tačno ovaj blok, bez ičeg posle:\n'+
    '###AKCIJA###\n[{"tip":"izmeni","stavka_id":"...","polja":{"kategorija":"nova vrednost"}}]\n###KRAJ###\n'+
    'Pravila: "tip" je "izmeni", "obrisi" ili "dodaj". Za "izmeni": "stavka_id" (tačan id) + "polja" (samo polja koja se menjaju: naziv/tip/kategorija/doziranje/napomena/rok). Za "obrisi": samo "stavka_id". Za "dodaj": bez "stavka_id", "polja" ima bar "naziv". '+
    'Ako ne predlažeš izmenu, NE dodaji ###AKCIJA### blok uopšte.';

  const history_parts = (history||[]).filter(m=>!m.thinking).map(m=>({ role: m.role==='user'?'user':'model', parts:[{text:m.text}] }));

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 25000);
  let resp;
  try{
    resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL_SEARCH+':generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sys }] },
        contents: [...history_parts, { role:'user', parts:[{ text: question }] }],
        generationConfig: { maxOutputTokens: 3500, temperature: 0.2 }
      }),
      signal: controller.signal
    });
  } catch(fetchErr){
    clearTimeout(timeoutId);
    if(fetchErr.name==='AbortError') throw new Error('Server nije odgovorio na vreme. Probaj ponovo.');
    throw new Error('Ne mogu da se povežem sa AI servisom: '+fetchErr.message);
  }
  clearTimeout(timeoutId);
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    if(resp.status===401) throw new Error('Google nije prihvatio ključ (401 - neautorizovan). Proveri da li si ključ tačno nalepio u Podešavanjima, ili napravi nov ključ na aistudio.google.com.');

  }
  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if(!candidate) throw new Error('Gemini nije vratio rezultat.');
  const text = (candidate.content && candidate.content.parts && candidate.content.parts.map(p=>p.text||'').join(' ').trim()) || '';
  if(!text) throw new Error('AI nije vratio odgovor.');
  return text;
}

/* ---------- Pouzdano brisanje u poljima forme (Android Chrome + Gboard) ----------
   Preneto iz aplikacija Stanje guma i Cenovnik (proveren kod).
   fieldOriginal: poznata DOBRA vrednost polja, upisana pri svakom iscrtavanju forme
   (polja se tada prave iznova, pa i kada AI popuni podatke sa slike).
   pristineArmed: polja čiji je sadržaj upravo označen tapom, a još nije menjan. */
const fieldOriginal = new WeakMap();
const pristineArmed = new WeakSet();
function snapshotField(el){ fieldOriginal.set(el, el.value); }
function handleFocusSelect(el){ el.select(); pristineArmed.add(el); }
function wireBackspace(el, prev, onRestore){
  if(!el) return;
  const goPrev = ()=>{ if(prev) prev.focus(); };
  el.addEventListener('focus', ()=> handleFocusSelect(el));
  el.addEventListener('keydown', (e)=>{
    if(e.key !== 'Backspace') return;
    if(el.value === '' || pristineArmed.has(el)){ e.preventDefault(); goPrev(); }
  });
  el.addEventListener('beforeinput', (e)=>{
    if(e.inputType !== 'deleteContentBackward') return;
    if(el.value === '' || pristineArmed.has(el)){ e.preventDefault(); goPrev(); }
  });
  el.addEventListener('input', ()=>{
    if(!pristineArmed.has(el)) return;
    let original = fieldOriginal.get(el);
    if(typeof original !== 'string') original = '';
    const trimmed = el.value.length < original.length && original.indexOf(el.value) === 0;
    if(trimmed){
      el.value = original;
      if(onRestore) onRestore();   // vraća i formDraft na dobru vrednost
      goPrev();
      return;
    }
    pristineArmed.delete(el);
  });
}
function wireFormFields(){
  const n = document.getElementById('fNaziv'), t = document.getElementById('fTip'), k = document.getElementById('fKategorija');
  [n,t,k].forEach(el=>{ if(el) snapshotField(el); });
  wireBackspace(n, null, ()=>updateDraft('naziv', n.value));
  wireBackspace(t, n,    ()=>updateDraft('tip', t.value));
  wireBackspace(k, t,    ()=>updateDraft('kategorija', k.value));
}

function saveItemForm(){

  const editId = formEditId;
  if(!editId){

      showDuplicateWarning(dup.naziv, ()=>{ doSaveItem(editId); });
      return;

function doSaveItem(editId){
  let newId = null;
  if(editId){
    const it = getItem(editId);
    Object.assign(it, formDraft);
  } else {
    newId = uid('m');
    items.push(Object.assign({ id: newId }, formDraft));
  }
  persistItems();
  render();
  closeItemForm();
  if(editId) renderDetail();
  if(newId) scrollAndHighlightItem(newId);

function scrollAndHighlightItem(id){

    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.add('card-added');
    setTimeout(()=>{ el.classList.remove('card-added'); }, 1800);

function pickPhotoFor(kind, purpose){

/* ---------- RUČNO OPSECANJE FOTOGRAFIJE ---------- */
let cropState = null;
let cropCloseFn = null;
function openCropScreen(dataUrl, purpose, swapFromFn){
  const img = new Image();
  img.onload = ()=>{ buildCropScreen(dataUrl, img, purpose, swapFromFn); };
  img.src = dataUrl;
}
function buildCropScreen(dataUrl, imgEl, purpose, swapFromFn){
  const stageMaxW = Math.min(window.innerWidth - 32, 480);
  const stageMaxH = window.innerHeight * 0.6;
  const fitScale = Math.min(1, stageMaxW / imgEl.naturalWidth, stageMaxH / imgEl.naturalHeight);
  const dispW = imgEl.naturalWidth * fitScale;
  const dispH = imgEl.naturalHeight * fitScale;
  const boxSize = Math.min(dispW, dispH) * 0.75;
  cropState = {
    dataUrl, img: imgEl, scale: fitScale, dispW, dispH, purpose: purpose||'main',
    box: { x: (dispW-boxSize)/2, y: (dispH-boxSize)/2, w: boxSize, h: boxSize },
    drag: null, onMove: null, onUp: null
  };
  const headerText = purpose==='leaflet' ? 'Prevuci i uokviri deo teksta koji AI treba da pročita' : 'Prevuci i uokviri deo slike koji želiš da zadržiš';
  const root = document.createElement('div');
  root.className = 'crop-overlay';
  root.id = 'cropOverlayRoot';
  root.innerHTML =
    '<div class="crop-header">'+headerText+'</div>'+
    '<div class="crop-stage" id="cropStage">'+
    '<div class="crop-img-wrap" id="cropImgWrap" style="width:'+dispW+'px;height:'+dispH+'px;">'+
    '<img src="'+dataUrl+'" style="width:100%;height:100%;display:block;" draggable="false">'+
    '<div class="crop-box" id="cropBox"><div class="crop-handle" id="cropHandle"></div></div>'+
    '</div></div>'+
    '<div class="crop-actions">'+
    '<button class="crop-skip" onclick="skipCrop()">Preskoči (cela slika)</button>'+
    '<button class="crop-confirm" onclick="confirmCrop()">Sačuvaj isečak</button>'+
    '</div>';
  document.body.appendChild(root);
  updateCropBoxStyle();
  attachCropDragHandlers();
  cropCloseFn = ()=>{
    if(cropState){
      if(cropState.onMove) window.removeEventListener('pointermove', cropState.onMove);
      if(cropState.onUp){ window.removeEventListener('pointerup', cropState.onUp); window.removeEventListener('pointercancel', cropState.onUp); }
    }
    const el = document.getElementById('cropOverlayRoot');
    if(el) el.remove();
    cropState = null;
    cropCloseFn = null;
  };
  if(swapFromFn){ swapOverlay(swapFromFn, cropCloseFn); }
  else { pushOverlay(cropCloseFn); }
}
function updateCropBoxStyle(){
  const el = document.getElementById('cropBox');
  if(!el || !cropState) return;
  const b = cropState.box;
  el.style.left = b.x+'px'; el.style.top = b.y+'px';
  el.style.width = b.w+'px'; el.style.height = b.h+'px';
}
function attachCropDragHandlers(){
  const box = document.getElementById('cropBox');
  const handle = document.getElementById('cropHandle');
  const wrap = document.getElementById('cropImgWrap');
  if(!box || !handle || !wrap || !cropState) return;

  function pos(e){
    const rect = wrap.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function onMoveStart(e){
    e.preventDefault();
    const p = pos(e);
    cropState.drag = { type:'move', startX:p.x, startY:p.y, origX:cropState.box.x, origY:cropState.box.y };
  }
  function onResizeStart(e){
    e.preventDefault(); e.stopPropagation();
    const p = pos(e);
    cropState.drag = { type:'resize', startX:p.x, startY:p.y, origW:cropState.box.w, origH:cropState.box.h };
  }
  function onMove(e){
    if(!cropState || !cropState.drag) return;
    e.preventDefault();
    const p = pos(e);
    const d = cropState.drag;
    if(d.type==='move'){
      let nx = d.origX + (p.x - d.startX);
      let ny = d.origY + (p.y - d.startY);
      nx = Math.max(0, Math.min(nx, cropState.dispW - cropState.box.w));
      ny = Math.max(0, Math.min(ny, cropState.dispH - cropState.box.h));
      cropState.box.x = nx; cropState.box.y = ny;
    } else if(d.type==='resize'){
      let nw = d.origW + (p.x - d.startX);
      let nh = d.origH + (p.y - d.startY);
      nw = Math.max(40, Math.min(nw, cropState.dispW - cropState.box.x));
      nh = Math.max(40, Math.min(nh, cropState.dispH - cropState.box.y));
      cropState.box.w = nw; cropState.box.h = nh;
    }
    updateCropBoxStyle();
  }
  function onUp(){ if(cropState) cropState.drag = null; }

  box.addEventListener('pointerdown', onMoveStart);
  handle.addEventListener('pointerdown', onResizeStart);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  cropState.onMove = onMove;
  cropState.onUp = onUp;
}
function closeCropScreen(){
  if(cropCloseFn){ closeOverlay(cropCloseFn); cropCloseFn = null; }
}
function skipCrop(){
  if(!cropState){ closeCropScreen(); return; }
  const { img, purpose } = cropState;
  const maxDim = 1100;
  let outW = img.naturalWidth, outH = img.naturalHeight;
  if(outW > maxDim || outH > maxDim){
    const ratio = Math.min(maxDim/outW, maxDim/outH);
    outW = outW*ratio; outH = outH*ratio;
  }
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(outW));
  canvas.height = Math.max(1, Math.round(outH));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
  closeCropScreen();
  handlePickedMedia(resizedDataUrl, purpose);
}
function confirmCrop(){
  if(!cropState) return;
  const { img, scale, box, purpose } = cropState;
  const sx = box.x/scale, sy = box.y/scale, sw = box.w/scale, sh = box.h/scale;
  const maxDim = 900;
  let outW = sw, outH = sh;
  if(outW > maxDim || outH > maxDim){
    const ratio = Math.min(maxDim/outW, maxDim/outH);
    outW = outW*ratio; outH = outH*ratio;
  }
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(outW));
  canvas.height = Math.max(1, Math.round(outH));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
  closeCropScreen();
  handlePickedMedia(croppedDataUrl, purpose);
}

async function callGeminiForMedicine(dataUrl){
  const apiKey = getApiKey();
  const match = /^data:([^;]+);base64,(.*)$/s.exec(dataUrl);
  if(!match) throw new Error('Neispravan format slike.');
  const mimeType = match[1], base64Data = match[2];

  const sys = 'Ovo je fotografija pakovanja leka, suplementa, vitamina ili slicnog proizvoda za kucnu apoteku. Procitaj SAMO ono sto je jasno vidljivo na slici. Vrati ISKLJUCIVO JSON objekat, bez markdown, bez ostalog teksta, u formatu: '+
    '{"naziv": tacan naziv proizvoda kako pise na pakovanju, ZAJEDNO sa jacinom/dozom ako je odstampana uz naziv (npr. "Brufen 400mg") - zadrzi original, ne prevodi brend, '+
    '"tip": najbolja procena jedne od kategorija ["Lek na recept","Lek bez recepta","Suplement","Vitamin","Krema","Probiotik","Protein"] na osnovu pakovanja, ili prazan string ako nije jasno, '+
    '"doziranje": SAMO stvarno uputstvo za upotrebu sa pakovanja - koliko puta dnevno, kada, kako, i nacin pripreme ako je naveden (npr. rastvaranje u vodi) (npr. "1 tableta 2x dnevno, posle jela") - na srpskom jeziku; NIKAD ovde ne stavljaj samu jacinu/dozu proizvoda (ta ide u naziv, npr. "400mg" ne ide ovde); ako uputstvo za upotrebu nije vidljivo na pakovanju, vrati prazan string, '+
    '"kategorija": KRATKA klasifikacija u 2-4 reči na srpskom (npr. "antibiotici", "vitamini", "protiv bolova", "za stomak", "koza") SAMO ako se moze zakljuciti sa pakovanja, ili prazan string. VAZNO za kategoriju: korisnik vec ima ove kategorije u apoteci: ['+knownCategories().join(', ')+'] — ako neka od njih smisleno odgovara, iskoristi TACNO tu istu formulaciju umesto slicne ali drugacije fraze; tek ako nijedna ne odgovara, napravi novu, '+
    '"rok": datum isteka roka trajanja u formatu GGGG-MM (SAMO mesec i godina, bez dana - na pakovanjima lekova rok obicno stoji odstampan samo kao MM/GGGG, npr. "02/2028" postaje "2028-02") SAMO ako je jasno napisan i citljiv na slici, inace null}. '+
    'VAZNO: nikad ne izmisljaj rok trajanja ako nije jasno citljiv - u tom slucaju vrati null za "rok". Ne izmisljaj ni ostala polja - ako nesto nije vidljivo, vrati prazan string.';

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 30000);
  let resp;
  try{
    resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sys }] },
        contents: [{ role:'user', parts: [{ inlineData: { mimeType, data: base64Data } }] }],
        generationConfig: { responseMimeType:'application/json', maxOutputTokens: 2000 }
      }),
      signal: controller.signal
    });
  } catch(fetchErr){
    clearTimeout(timeoutId);
    if(fetchErr.name==='AbortError') throw new Error('Server nije odgovorio na vreme. Proveri internet i probaj ponovo.');
    throw new Error('Ne mogu da se povežem sa AI servisom: '+fetchErr.message);
  }
  clearTimeout(timeoutId);
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    if(resp.status===400 && /API key/i.test(errBody)) throw new Error('Gemini API ključ nije važeći. Proveri ga u Podešavanjima.');
    if(resp.status===401) throw new Error('Google nije prihvatio ključ (401 - neautorizovan). Proveri da li si ključ tačno nalepio u Podešavanjima, ili napravi nov ključ na aistudio.google.com.');
    throw new Error('Gemini API greška ('+resp.status+'): '+errBody.slice(0,180));
  }
  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if(!candidate) throw new Error('Gemini nije vratio rezultat.');
  const raw = (candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text) || '';
  let result;
  try{ result = JSON.parse(raw); }catch(e){ throw new Error('Ne mogu da protumačim AI odgovor.'); }
  return {
    naziv: (result.naziv||'').trim(),
    tip: (result.tip||'').trim(),
    doziranje: (result.doziranje||'').trim(),
    kategorija: (result.kategorija||'').trim(),
    rok: result.rok || null
  };
}

  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if(!candidate) throw new Error('Gemini nije vratio rezultat.');
  const raw = (candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text) || '';
  let result;
  try{ result = JSON.parse(raw); }catch(e){ throw new Error('Ne mogu da protumačim AI odgovor.'); }
  return {
    naziv: (result.naziv||'').trim(),
    tip: (result.tip||'').trim(),
    doziranje: (result.doziranje||'').trim(),
    napomena: (result.napomena||'').trim(),
    kategorija: (result.kategorija||'').trim(),
    rok: result.rok || null,
    prosireno: (result.prosireno||'').trim()
  };
}

/* ---------- PRETRAGA INTERNETA SA IZVOROM (Google Search grounding) ---------- */
async function fetchInternetInfo(id){
  const it = getItem(id);
  if(!it) return;
  const apiKey = getApiKey();
  if(!apiKey){
    showBanner('Nije unet Gemini API ključ. Idi u Podešavanja (⚙) i unesi ga.');
    return;
  }
  internetSearchLoadingId = id;
  renderDetail();
  try{
    const result = await callGeminiWebSearch(it.naziv, it.tip);
    it.internetInfo = result;
    persistItems();
  } catch(err){
    showBanner(err && err.message ? err.message : 'Greška pri pretrazi interneta.');
  }
  internetSearchLoadingId = null;
  renderDetail();
}

async function callGeminiWebSearch(naziv, tip){
  const apiKey = getApiKey();
  const sys = 'Pretraži internet i saznaj pouzdane informacije o proizvodu "'+naziv+'"'+(tip?(' ('+tip+')'):'')+
    '. Odgovori na srpskom jeziku, kratko i jasno (najviše 5 rečenica): za šta se koristi, uobičajeno doziranje, i najvažnija upozorenja/kontraindikacije. '+
    'Ako ne možeš pouzdano da identifikuješ tačno ovaj proizvod na internetu, jasno to reci umesto da izmišljaš podatke.';

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 25000);
  let resp;
  try{
    resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL_SEARCH+':generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey },
      body: JSON.stringify({
        contents: [{ role:'user', parts: [{ text: sys }] }],
        tools: [{ google_search: {} }],
        generationConfig: { maxOutputTokens: 1200, temperature: 0.2 }
      }),
      signal: controller.signal
    });
  } catch(fetchErr){
    clearTimeout(timeoutId);
    if(fetchErr.name==='AbortError') throw new Error('Server nije odgovorio na vreme. Probaj ponovo.');
    throw new Error('Ne mogu da se povežem sa AI servisom: '+fetchErr.message);
  }
  clearTimeout(timeoutId);
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    if(resp.status===401) throw new Error('Google nije prihvatio ključ (401 - neautorizovan). Proveri da li si ključ tačno nalepio u Podešavanjima, ili napravi nov ključ na aistudio.google.com.');
    throw new Error('Gemini API greška ('+resp.status+'): '+errBody.slice(0,180));
  }
  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if(!candidate) throw new Error('Gemini nije vratio rezultat.');
  const text = (candidate.content && candidate.content.parts && candidate.content.parts.map(p=>p.text||'').join(' ').trim()) || '';
  if(!text) throw new Error('AI nije vratio odgovor.');
  let izvorUrl = '', izvorNaziv = '';
  const gm = candidate.groundingMetadata;
  if(gm && gm.groundingChunks && gm.groundingChunks.length){
    const web = gm.groundingChunks[0].web;
    if(web){ izvorUrl = web.uri||''; izvorNaziv = web.title||''; }
  }
  return { tekst: text, izvorUrl, izvorNaziv, datum: todayISO() };
}

  };
}

/* ---------- UPOZORENJE O DUPLIKATU ---------- */
let __dupYes = null;
let dupCloseFn = null;
function findDuplicateItem(naziv, excludeId){
  const target = foldDiacritics((naziv||'').trim());
  if(!target) return null;
  return items.find(it => it.id!==excludeId && foldDiacritics((it.naziv||'').trim())===target) || null;
}
function showDuplicateWarning(existingNaziv, onYes){
  __dupYes = onYes;
  const b = document.createElement('div'); b.className='modal-backdrop'; b.id='dupBackdrop';
  b.innerHTML = '<div class="modal" style="border-radius:22px;">'+
    '<h2 class="serif">Moguć duplikat</h2>'+
    '<p style="font-size:14.5px; color:var(--text); line-height:1.5; margin:0 0 20px;">Već postoji stavka sa nazivom "'+escapeHtml(existingNaziv)+'" u kućnoj apoteci. Da li ipak želiš da dodaš ovo kao novu, odvojenu stavku?</p>'+
    '<div class="modal-actions"><button class="cancel-btn" onclick="closeDuplicateWarning()">Otkaži</button>'+
    '<button class="save-btn" onclick="runDupYes()">Ipak dodaj</button></div></div>';
  document.body.appendChild(b);
  b.addEventListener('click',(e)=>{ if(e.target===b) closeDuplicateWarning(); });
  dupCloseFn = ()=>{ const bb=document.getElementById('dupBackdrop'); if(bb) bb.remove(); __dupYes=null; dupCloseFn=null; };
  pushOverlay(dupCloseFn);
}
function closeDuplicateWarning(){
  if(dupCloseFn){ closeOverlay(dupCloseFn); dupCloseFn = null; }
}
function runDupYes(){ const fn=__dupYes; closeDuplicateWarning(); if(fn) fn(); }

loadSettings();
applyTheme(getTheme());
loadItems();
loadShoppingList();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
